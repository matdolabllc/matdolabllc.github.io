<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 190" role="img" aria-label="A worked solution in three steps, with the second step flagged and magnified">
  <circle cx="120" cy="94" r="80" fill="#4fd1c5" opacity="0.18"/>
  <ellipse cx="120" cy="164" rx="86" ry="9" fill="#f3eede"/>

  <!-- the worked solution -->
  <rect x="40" y="28" width="150" height="130" rx="12" fill="#faf8f1" stroke="#1d3b34" stroke-width="3.2"/>
  <path d="M40 40a12 12 0 0 1 12-12h126a12 12 0 0 1 12 12v10H40z" fill="#1f6f63"/>
  <rect x="50" y="35" width="44" height="8" rx="4" fill="#faf8f1" opacity="0.9"/>

  <path d="M62 70 V136" stroke="#d7d3c4" stroke-width="3" stroke-linecap="round"/>

  <!-- step 1 -->
  <circle cx="62" cy="70" r="8" fill="#2f8f7f"/>
  <rect x="78" y="63" width="62" height="5" rx="2.5" fill="#d7d3c4"/>
  <rect x="78" y="72" width="48" height="8" rx="4" fill="#cfe9e2"/>

  <!-- step 2: where the working went wrong -->
  <rect x="50" y="88" width="132" height="30" rx="8" fill="#F24E1E" opacity="0.1"/>
  <circle cx="62" cy="103" r="8" fill="#F24E1E"/>
  <path d="M62 98 v5.4" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="62" cy="107.4" r="1.6" fill="#fff"/>
  <rect x="78" y="95" width="70" height="5" rx="2.5" fill="#d7d3c4"/>
  <rect x="78" y="104" width="58" height="8" rx="4" fill="#fbd3c5"/>

  <!-- step 3 -->
  <circle cx="62" cy="136" r="8" fill="#2f8f7f"/>
  <rect x="78" y="129" width="54" height="5" rx="2.5" fill="#d7d3c4"/>
  <rect x="78" y="138" width="40" height="8" rx="4" fill="#cfe9e2"/>

  <!-- magnifier on the slip -->
  <circle cx="150" cy="108" r="18" fill="#fff" fill-opacity="0.75" stroke="#1d3b34" stroke-width="4"/>
  <path d="M138 111 q3 -4.5 6 0 t6 0 t6 0 t6 0" fill="none" stroke="#F24E1E" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="139" y="100" width="20" height="4.5" rx="2.25" fill="#d7d3c4"/>
  <path d="M163 121 L180 138" stroke="#1d3b34" stroke-width="8" stroke-linecap="round"/>
  <path d="M164.5 122.5 L169 127" stroke="#E8A62E" stroke-width="8" stroke-linecap="round"/>
