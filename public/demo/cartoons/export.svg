<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 190" role="img" aria-label="Exporting attendance to a spreadsheet">
  <circle cx="120" cy="96" r="80" fill="#f0e2bd" opacity="0.55"/>

  <!-- spreadsheet sheet -->
  <rect x="60" y="34" width="120" height="112" rx="12" fill="#faf8f1" stroke="#1d3b34" stroke-width="3.2"/>
  <!-- header band -->
  <path d="M60 46a12 12 0 0 1 12-12h96a12 12 0 0 1 12 12v10H60z" fill="#1f6f63"/>
  <rect x="70" y="41" width="26" height="8" rx="4" fill="#faf8f1" opacity="0.9"/>
  <rect x="104" y="41" width="26" height="8" rx="4" fill="#faf8f1" opacity="0.6"/>
  <rect x="138" y="41" width="26" height="8" rx="4" fill="#faf8f1" opacity="0.6"/>

  <!-- grid lines -->
  <line x1="98" y1="56" x2="98" y2="146" stroke="#d7d3c4" stroke-width="2.4"/>
  <line x1="132" y1="56" x2="132" y2="146" stroke="#d7d3c4" stroke-width="2.4"/>
  <line x1="166" y1="56" x2="166" y2="146" stroke="#d7d3c4" stroke-width="2.4"/>
  <line x1="60" y1="78" x2="180" y2="78" stroke="#d7d3c4" stroke-width="2.4"/>
  <line x1="60" y1="100" x2="180" y2="100" stroke="#d7d3c4" stroke-width="2.4"/>
  <line x1="60" y1="122" x2="180" y2="122" stroke="#d7d3c4" stroke-width="2.4"/>

  <!-- cell contents -->
  <rect x="68" y="63" width="22" height="8" rx="4" fill="#2f8f7f"/>
  <rect x="106" y="63" width="18" height="8" rx="4" fill="#7c9a6f"/>
  <rect x="68" y="85" width="22" height="8" rx="4" fill="#2f8f7f"/>
  <rect x="140" y="85" width="18" height="8" rx="4" fill="#4fd1c5"/>
  <rect x="68" y="107" width="22" height="8" rx="4" fill="#2f8f7f"/>
  <rect x="106" y="107" width="18" height="8" rx="4" fill="#7c9a6f"/>

  <!-- export / download badge -->
  <circle cx="164" cy="140" r="19" fill="#1f6f63" stroke="#faf8f1" stroke-width="3"/>
  <path d="M164 131v13" stroke="#faf8f1" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M158 138l6 6 6-6" fill="none" stroke="#faf8f1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M156 149h16" stroke="#faf8f1" stroke-width="3.2" stroke-linecap="round"/>
</svg>
