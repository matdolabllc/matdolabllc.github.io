  <rect x="70" y="47" width="26" height="8" rx="4" fill="#faf8f1" opacity="0.9"/>
  <rect x="104" y="47" width="26" height="8" rx="4" fill="#faf8f1" opacity="0.6"/>
  <rect x="138" y="47" width="26" height="8" rx="4" fill="#faf8f1" opacity="0.6"/>
  <!-- grid -->
  <line x1="98" y1="62" x2="98" y2="144" stroke="#d7d3c4" stroke-width="2.4"/>
  <line x1="132" y1="62" x2="132" y2="144" stroke="#d7d3c4" stroke-width="2.4"/>
  <line x1="166" y1="62" x2="166" y2="144" stroke="#d7d3c4" stroke-width="2.4"/>
  <line x1="60" y1="84" x2="180" y2="84" stroke="#d7d3c4" stroke-width="2.4"/>
  <line x1="60" y1="106" x2="180" y2="106" stroke="#d7d3c4" stroke-width="2.4"/>
  <!-- cells -->
  <rect x="68" y="69" width="22" height="8" rx="4" fill="#2f8f7f"/>
  <rect x="106" y="69" width="18" height="8" rx="4" fill="#7c9a6f"/>
