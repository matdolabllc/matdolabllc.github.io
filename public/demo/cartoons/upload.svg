  <rect x="106" y="91" width="18" height="8" rx="4" fill="#7c9a6f"/>

  <!-- upload / import badge -->
  <circle cx="164" cy="138" r="19" fill="#1f6f63" stroke="#faf8f1" stroke-width="3"/>
  <path d="M164 145v-13" stroke="#faf8f1" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M158 138l6 -6 6 6" fill="none" stroke="#faf8f1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
