<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 190" role="img" aria-label="A child doing homework at a desk">
  <circle cx="120" cy="94" r="80" fill="#f0e2bd" opacity="0.5"/>
  <ellipse cx="120" cy="164" rx="86" ry="9" fill="#f3eede"/>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- child body behind desk -->
    <path d="M84 132 q0 -44 22 -44 q22 0 22 44 z" fill="#2f8f7f"/>
    <!-- resting left arm -->
    <path d="M96 94 L82 118" stroke="#2f8f7f" stroke-width="8"/>
    <circle cx="82" cy="119" r="4.5" fill="#E8C9A2"/>
    <!-- head -->
    <circle cx="106" cy="60" r="14" fill="#E8C9A2"/>
    <path d="M92 59 a14 14 0 0 1 28 0 q-14 -10 -28 0 z" fill="#2A3A36"/>
    <circle cx="101" cy="60" r="1.6" fill="#1a2422"/>
    <circle cx="110" cy="60" r="1.6" fill="#1a2422"/>
    <path d="M101 66 q5 4 10 0" fill="none" stroke="#1a2422" stroke-width="2"/>

    <!-- desk -->
    <rect x="72" y="130" width="10" height="30" rx="5" fill="#6f8f62"/>
    <rect x="158" y="130" width="10" height="30" rx="5" fill="#6f8f62"/>
    <rect x="60" y="122" width="120" height="12" rx="6" fill="#7c9a6f"/>

    <!-- open book -->
    <path d="M62 118 q12 -6 24 -1 q12 -5 24 1 l0 6 q-12 -6 -24 -1 q-12 -5 -24 1 z" fill="#faf8f1" stroke="#1d3b34" stroke-width="2.6"/>

    <!-- paper -->
    <rect x="104" y="104" width="46" height="26" rx="3" fill="#faf8f1" stroke="#1d3b34" stroke-width="2.6"/>
    <rect x="110" y="111" width="30" height="2.6" rx="1.3" fill="#d7d3c4"/>
    <rect x="110" y="117" width="30" height="2.6" rx="1.3" fill="#d7d3c4"/>
    <rect x="110" y="123" width="20" height="2.6" rx="1.3" fill="#d7d3c4"/>

    <!-- writing arm + pencil -->
    <path d="M116 92 L126 116" stroke="#E8C9A2" stroke-width="7"/>
    <circle cx="126" cy="117" r="5" fill="#E8C9A2"/>
    <path d="M129 121 L145 102" stroke="#7c9a6f" stroke-width="6" stroke-linecap="round"/>
    <path d="M143 105 L147 100" stroke="#1d3b34" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
