<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title description">
  <title id="title">Matdo Grade logo</title>
  <desc id="description">The Matdo Grade logo with a sage M, forest-green D-shaped pocket, and a bold cursive achievement-gold A-plus. The background is transparent.</desc>

