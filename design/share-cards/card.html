<!doctype html>
<!--
  Link-preview (Open Graph) card template, rendered at 1200x630 by render.py.
  Pick a variant with the query string: card.html?v=grade | check | site
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Fraunces"; src: url("../../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Inter"; src: url("../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  :root { --forest: #1d3b34; --ink: #1a2422; --cream: #faf8f1; --accent: #1f6f63; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--cream); }
  body { font-family: "Inter", system-ui, sans-serif; color: var(--ink); position: relative; }
  .art { position: absolute; top: 0; right: 0; width: 700px; height: 630px; overflow: hidden; }
  .art img { width: 100%; height: 100%; object-fit: cover; }
  /* Fade the illustration into the cream text column. */
  .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--cream) 0%, rgb(250 248 241 / 0.85) 12%, rgb(250 248 241 / 0) 34%); }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .mark { height: 104px; width: auto; align-self: flex-start; margin-bottom: 28px; }
  .name { font-weight: 700; font-size: 26px; letter-spacing: 0.01em; color: var(--accent); margin-bottom: 14px; }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 62px; line-height: 1.06; letter-spacing: -0.02em; color: var(--forest); text-wrap: balance; }
  .sub { font-size: 25px; line-height: 1.4; color: #3d4b47; margin-top: 22px; max-width: 500px; }
</style>
</head>
<body>
  <div class="art"><img id="art" alt="" /></div>
  <div class="copy">
    <img class="mark" id="mark" alt="" />
    <p class="name" id="name"></p>
    <h1 id="headline"></h1>
    <p class="sub" id="sub"></p>
  </div>
<script>
  const variants = {
    grade: {
      accent: "#b08a3e",
      mark: "../../public/logos/matdo-grade-mark.png",
      art: "../../public/demo/grade/features/parent-ipad-illustration.webp",
      artPos: "62% 50%",
      name: "Matdo Grade",
      headline: "Paper homework. Graded on iPad.",
      sub: "Snap a photo. Get marks and explanations. No answer key needed.",
    },
    check: {
      accent: "#1f6f63",
      mark: "../../public/logos/matdo-check-mark.png",
      art: "../../public/demo/cartoons/check-in-illustration.webp",
      artPos: "58% 50%",
      name: "Matdo Check",
      headline: "Simple. Reliable. Easy setup.",
      sub: "Attendance check-in on the iPad you already have.",
    },
    site: {
      accent: "#1f6f63",
      mark: "../../public/logos/matdo-mark.png",
      art: "../../public/demo/about/father-daughter-homework.webp",
      artPos: "55% 50%",
      name: "Matdo",
      headline: "Less admin. More teaching.",
      sub: "Simple, reliable, affordable tools for parents, tutors, and educators.",
    },
  };
  const v = variants[new URLSearchParams(location.search).get("v")] || variants.site;
  document.documentElement.style.setProperty("--accent", v.accent);
  document.getElementById("mark").src = v.mark;
  const art = document.getElementById("art");
  art.src = v.art;
  art.style.objectPosition = v.artPos;
  document.getElementById("name").textContent = v.name;
  document.getElementById("headline").textContent = v.headline;
  document.getElementById("sub").textContent = v.sub;
</script>
</body>
</html>
